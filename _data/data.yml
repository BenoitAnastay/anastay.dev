career-profile:
    title: Présentation
    summary: |
      Je suis un informaticien autodidacte, j'ai travaillé en Freelance avant
      de rejoindre une petite SARL d'emailling dans laquelle j'étais
      responsable de toute l'infrastructure informatique de l'entreprise,
      les défis que représente le mass-mailing m'ont permis de développer
      des compétences variées.

      J'ai par la suite travaillé dans une entreprise adaptée pour
      laquelle j'ai développé un module Odoo pour la gestion des demandes de
      devis et adapté le module GMAO à leurs besoins.
education:
    title: Formation
    info:
        - degree: Piscine
          university: École 42
          time: Juillet 2016
          details: |
            Formation et épreuve d'un mois en développement informatique,
            l'environement de travail est principalement le terminal OSX
            avec git en gestionaire de de versions et VIM ou Jetbrain en IDE

            Les travaux de groupe et la pair aidance sont les méthodes
            d'apprentissange privilégiés de cette école
              - Programmation bas niveau C 99 x86
              - Maitrise des normes de programmations
              - Codage de fonctions complexes sans utilisation de librairies et
              des fonctions du kernel Linux
              - Maitrise du shell et de l'environnement Unix
              - Travail en équipe
        - degree: BEP Metiers Administratifs
          university: Lycée Professionnel Sophie Germain Thionville
          time: 2012 - 2013
          details: |
            Formation généraliste des métiers de gestion administrative
            d'entreprise (facturation, secreteriat, déclarations CA,
            comptabilité)
              - Maitrise de la facturation sous Ciel Comptabilité
              - Maitrise des logiciels Microsoft World et Microsoft Excel
              - Rédaction de lettres en environnement B2B, prise de contact
              téléphonique
              - Rédaction de déclarations TVA, factures, factures d'avoir,
              échéanciers
              - Bases du commerce international
              - Lecture du plan comptable
              - Gestion des comptes Client, Fournisseur, Banque, etc…
        - degree: BEP Maintenance des Systèmes Mécaniques Automatisés
          university: Lycée Polyvalent La Briquerie site de La Malgrange
          time: 2011 - 2012
          details: |
            Formation en mécanique industriel.
            _intérompue pour raisons médicale_
              - Dessin industriel
              - Cours de mécanique
        - degree: BEP Electrotechnique Energie Equipements Communicants
          university: Lycée Professionnel Gaspard Monge Knutange
          time: 2009 - 2011
          details: |
            Formation en electricité générale et electricité industrielle.
              - Réalisation de schéma électrique dans un environnement
              domestique et industriel
              - Maintenance et réalisation de coffrets électriques
              (Chaines de production, outillage)
              - Programmation d'automates à des fins d'automatisation
              de la production
              - Câblage et pose d'appareillages dans un environnement
              domestique, tertiaire et industriel
              - Achat de matériel en fonction des contraintes techniques
              et des normes

experiences:
    title: Expériences professionnelles
    info:
        - role: Assistant Informatique
          time: Octobre 2024 - Mars 2025
          company: APPEP
          details: |
            - Transformation de tableaux Excel en bases de données relationnelles.
            - Création d'un module Odoo pour le suivi des demandes de devis, personnalisation du module de GMAO. 
            - Réalisation d'un étiquetage et d'un inventaire des outils pour la GMAO.
            - Installation d'un serveur Debian, avec sauvegarde Borgmatic sur NAS local, Caddy, Odoo, Gitea et UFW
            - Création d'une documentation utilisateur et d'une documentation technique.
        - role: Administrateur système & réseau / Devops
          time: Mai 2014 - Février 2017
          company: WEBLEV INDUSTRY
          details: |
            J'ai configuré des serveurs d'emails avec
            plusieurs noms de domaines et adresses IPs, en automatisant les
            procédures pour éviter le paramétrage manuel.

            Pendant ces deux années, j'ai sécurisé l'infrastructure,
            éliminé les pannes potentielles et amélioré la délivrabilité
            des emails.

            J'ai utilisé des technologies comme vSphere, OVH vRack, Ansible,
            PHP, C pour le multithreading, ZFS, Redis, PKI, Fail2Ban, pfSense,
            FreeIPA et FreeNAS.

            - Mise en place de serveurs SMTP (PowerMTA) avec front-ends PHP
            (Interspire | OemPro)
            - Développement d'une plateforme d'administration centralisée
            avec la bibliothèque Phalcon-PHP
            - Provisionnement automatique des machines virtuelles dans
            l'environnement vSphere avec ISO Kickstarter CentOS)
            - Configuration automatique de PMTA, Nginx, MongoDB, Redis,
            OpenSSH, Let's Encrypt SSL, MySQL, PHP-FPM et du front-end
        - role: Sous-traitant informatique
          time: 2015
          company: Captain Lead · Freelance
          details: |
            Vente et déploiement du produit développé pour WEBLEV INDUSTRY.
            Participation au développement de l'API d'e-mailing en NodeJS
            (interface SMTP).
        - role: Technicien informatique
          time: 2013
          company: Succeed Together · Freelance
          details: |
            Mise en place d'un réseau WiFi au Pavillon Gabriel à Paris (Place
            de la Concorde).
            Réseau mis en service le matin avant la conférence d'entreprise et
            démonté le soir après le départ des participants.
            Installation de 5 points d'accès CISCO redondants.

